<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Einkaufszettel</title>
<meta name="description" content="Einfacher Einkaufszettel ohne Werbung und ohne Konto.">
<meta name="theme-color" content="#edf0ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1411" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Einkauf">
<link rel="preload" href="fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
</head>
<body>
<svg class="sprite" aria-hidden="true">
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.500L19 7.500"/></symbol>
<!-- Eigene farbige Zeichnungen für Motive, die es bei Noto Emoji nicht gibt -->
<symbol id="x-bun" viewBox="0 0 24 24"><path d="M3 13a9 6.5 0 0 1 18 0v1a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4z" fill="#d48f3a"/><path d="M5 12.6a7 4.6 0 0 1 14 0c-2 .9-4.400 1.400-7 1.400s-5-.5-7-1.400z" fill="#eab567"/><path d="M8.600 9.600l1.300 2.400M11.600 8.700l1.300 2.900M14.600 9.600l1.300 2.400" fill="none" stroke="#b9772a" stroke-width="1.300" stroke-linecap="round"/></symbol>
<symbol id="x-cup" viewBox="0 0 24 24"><path d="M5.500 8h13l-1.300 11.300a2 2 0 0 1-2 1.700H8.800a2 2 0 0 1-2-1.700z" fill="#f1f5fb"/><path d="M6 12.500h12l-.5 4.500h-11z" fill="#4a90e2"/><circle cx="12" cy="14.750" r="1.300" fill="#fff"/><path d="M4.800 5.500h14.400a1 1 0 0 1 1 1V8H3.800V6.500a1 1 0 0 1 1-1z" fill="#b9cbe0"/></symbol>
<symbol id="x-sausage" viewBox="0 0 24 24"><path d="M5.500 17.500Q13 17.500 18.500 7" fill="none" stroke="#b8493a" stroke-width="6.400" stroke-linecap="round"/><path d="M6.500 15.500Q11.500 15 15.500 8.500" fill="none" stroke="#dc7d6b" stroke-width="1.500" stroke-linecap="round"/><path d="M3.200 19.800l1-1M20.800 4.200l-1 1.200" fill="none" stroke="#8a3528" stroke-width="1.600" stroke-linecap="round"/></symbol>
<symbol id="x-roll" viewBox="0 0 24 24"><defs><linearGradient id="g-roll" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbfcfd"/><stop offset=".55" stop-color="#dbe3eb"/><stop offset="1" stop-color="#aab7c4"/></linearGradient><linearGradient id="g-sheet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b4c0cc"/><stop offset=".35" stop-color="#e9eef3"/><stop offset="1" stop-color="#d2dbe4"/></linearGradient></defs><path d="M4.500 10h13.500v9.300l-2.250 1.200-2.250-1.200-2.250 1.200-2.250-1.200-2.250 1.200-2.250-1.200z" fill="url(#g-sheet)"/><rect x="2.500" y="3.500" width="19" height="8.500" rx="4.250" fill="url(#g-roll)"/><ellipse cx="18.900" cy="7.750" rx="2.300" ry="4.100" fill="#c3ced9"/><ellipse cx="18.900" cy="7.750" rx="1" ry="1.900" fill="#9a7b54"/><path d="M5.500 5.600h10" fill="none" stroke="#fff" stroke-width="1" stroke-linecap="round" opacity=".9"/></symbol>
<symbol id="x-bag" viewBox="0 0 24 24"><path d="M7 4h10l-1 3 2 3v9a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2v-9l2-3z" fill="#f0e4c9"/><path d="M7 4h10l-1 3H8z" fill="#d6c39a"/><rect x="8.500" y="11.500" width="7" height="5.500" rx="1.200" fill="#c79a4e"/></symbol>
</svg>

<div class="app">
  <header class="top">
    <div class="bar">
      <button class="listbtn" id="listbtn" type="button" aria-haspopup="dialog">
        <span id="listname"></span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
      <span class="count" id="count"></span>
    </div>
  </header>
  <div class="stick">
    <div class="track" id="track" role="progressbar" aria-label="Erledigt" aria-valuemin="0" aria-valuemax="100"><i id="trackbar"></i></div>
    <form class="search" id="searchform" autocomplete="off">
      <div class="field-wrap">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.500"></circle><path d="M16 16l4.500 4.500"></path></svg>
        <input id="q" type="text" inputmode="search" enterkeyhint="done" placeholder="Artikel hinzufügen" aria-label="Artikel hinzufügen" autocapitalize="sentences" spellcheck="false">
        <button class="clear" id="clearq" type="button" aria-label="Eingabe löschen" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </div>
      <button class="done-btn" id="closesearch" type="button" hidden>Fertig</button>
    </form>
  </div>
  <main id="main"></main>
  <section id="sug" hidden></section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden><span id="toastmsg"></span><button type="button" id="toastundo">Rückgängig</button></div>
<div class="veil" id="veil" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script src="katalog.js"></script>
<script src="app.js"></script>
</body>
</html>
